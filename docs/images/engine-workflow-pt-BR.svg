<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1270" viewBox="0 0 960 1270" role="img" aria-labelledby="title desc" lang="pt-BR"><title id="title">Da engenharia à execução</title><desc id="desc">Desenvolvedor / Engenharia → engine.vc → Operador autorizado · VoigtCore → Native Container → Engine em execução.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07141c"/><stop offset="1" stop-color="#102629"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d8b768"/></marker></defs><rect width="960" height="1270" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,Noto Sans,sans-serif">
 <text x="480" y="50" text-anchor="middle" fill="#d8b768" font-size="20" font-weight="600">VCORE ENGINE DEVELOPMENT PLATFORM</text><text x="480" y="101" text-anchor="middle" fill="#f0f6f6" font-size="36" font-weight="700">Da engenharia à execução</text><text x="480" y="140" text-anchor="middle" fill="#bdcdd0" font-size="22" font-weight="400">Cada etapa tem uma responsabilidade.</text>
 <rect x="70" y="175" width="820" height="108" rx="18" fill="#10242b" stroke="#35565b" stroke-width="2"/><text x="480" y="218" text-anchor="middle" fill="#f0f6f6" font-size="30" font-weight="600">Desenvolvedor / Engenharia</text><text x="480" y="253" text-anchor="middle" fill="#bdcdd0" font-size="24" font-weight="400">Cria o motor, define o contrato e testa.</text>
 <path d="M480 284V316" stroke="#d8b768" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="329" width="820" height="105" rx="18" fill="#10242b" stroke="#a28b51" stroke-width="2"/><text x="480" y="370" text-anchor="middle" fill="#e2c780" font-size="32" font-weight="700">engine.vc</text><text x="480" y="408" text-anchor="middle" fill="#bdcdd0" font-size="24" font-weight="400">Código + contrato + versão + assinatura</text>
 <text x="480" y="464" text-anchor="middle" fill="#d8b768" font-size="21" font-weight="400">Constrói, assina e entrega</text><path d="M480 479V503" stroke="#d8b768" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="70" y="518" width="820" height="300" rx="18" fill="#10242b" stroke="#a28b51" stroke-width="2"/><text x="480" y="558" text-anchor="middle" fill="#f0f6f6" font-size="29" font-weight="600">Operador autorizado · VoigtCore</text><text x="480" y="592" text-anchor="middle" fill="#bdcdd0" font-size="23" font-weight="400">Revisa e controla a autorização.</text>
 <rect x="94" y="616" width="372" height="86" rx="10" fill="#0a1a22" stroke="#36565a"/><text x="280" y="649" text-anchor="middle" fill="#70e7c4" font-size="25" font-weight="600">Runtime VCore</text><text x="280" y="679" text-anchor="middle" fill="#bdcdd0" font-size="20" font-weight="400">Ambiente de execução</text><rect x="494" y="616" width="372" height="86" rx="10" fill="#0a1a22" stroke="#36565a"/><text x="680" y="649" text-anchor="middle" fill="#70e7c4" font-size="25" font-weight="600">Política</text><text x="680" y="679" text-anchor="middle" fill="#bdcdd0" font-size="20" font-weight="400">Permissões e limites</text><rect x="94" y="708" width="372" height="86" rx="10" fill="#0a1a22" stroke="#36565a"/><text x="280" y="741" text-anchor="middle" fill="#70e7c4" font-size="25" font-weight="600">Registro de pacotes</text><text x="280" y="771" text-anchor="middle" fill="#bdcdd0" font-size="20" font-weight="400">Identifica a versão entregue</text><rect x="494" y="708" width="372" height="86" rx="10" fill="#0a1a22" stroke="#36565a"/><text x="680" y="741" text-anchor="middle" fill="#70e7c4" font-size="25" font-weight="600">Admissão</text><text x="680" y="771" text-anchor="middle" fill="#bdcdd0" font-size="20" font-weight="400">Decide o que pode executar</text>
 <text x="480" y="850" text-anchor="middle" fill="#d8b768" font-size="22" font-weight="400">Somente com autorização válida</text><path d="M480 863V890" stroke="#d8b768" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="70" y="906" width="820" height="129" rx="18" fill="#10242b" stroke="#35565b" stroke-width="2"/><text x="480" y="947" text-anchor="middle" fill="#f0f6f6" font-size="30" font-weight="700">Native Container</text><text x="480" y="982" text-anchor="middle" fill="#bdcdd0" font-size="23" font-weight="400">Confere identidade, integridade, assinatura e revogação.</text><text x="480" y="1014" text-anchor="middle" fill="#bdcdd0" font-size="23" font-weight="400">Aplica isolamento e limites de execução.</text>
 <path d="M480 1036V1071" stroke="#d8b768" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="1087" width="820" height="96" rx="18" fill="#10242b" stroke="#55bc9f" stroke-width="2"/><text x="480" y="1126" text-anchor="middle" fill="#72edc8" font-size="29" font-weight="700">Engine em execução</text><text x="480" y="1162" text-anchor="middle" fill="#bdcdd0" font-size="23" font-weight="400">Capacidades autorizadas · resultados · histórico</text>
 <text x="480" y="1220" text-anchor="middle" fill="#bdcdd0" font-size="21" font-weight="400">O Core privado permanece fora do kit do desenvolvedor.</text><text x="480" y="1252" text-anchor="middle" fill="#93aeb5" font-size="18" font-weight="400">Fluxo conceitual · edição experimental</text>
 </g></svg>